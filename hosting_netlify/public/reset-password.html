<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - PetAdopt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #f5f5f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #6C5CE7; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:disabled { background-color: #a29bfe; cursor: not-allowed; }
        .hidden { display: none; }
        .error { color: #d63031; margin-top: 10px; font-size: 14px; }
        .success { color: #00b894; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="loading">
            <h2>Cargando...</h2>
            <p>Verificando credenciales...</p>
        </div>

        <div id="reset-form" class="hidden">
            <h2>Nueva Contraseña</h2>
            <p>Escribe tu nueva clave:</p>
            <input type="password" id="password" placeholder="Nueva contraseña" minlength="6">
            <button onclick="updatePassword()" id="submit-btn">Actualizar Contraseña</button>
            <p id="form-error" class="error"></p>
        </div>

        <div id="success-msg" class="hidden">
            <h2 class="success">¡Listo!</h2>
            <p>Tu contraseña ha sido actualizada.</p>
            <p>Ya puedes cerrar esta ventana e ingresar en la App.</p>
        </div>

        <div id="error-msg" class="hidden">
            <h2>Error</h2>
            <p id="error-text">...</p>
        </div>
    </div>

    <script>
        let supabaseClient;

        async function init() {
            try {
                // 1. Obtener config de Netlify
                const configResponse = await fetch('/.netlify/functions/config');
                const config = await configResponse.json();
                
                // 2. Iniciar Cliente
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                // 3. Buscar TOKEN en el Hash (#) -> Esto es el Implicit Flow
                // La URL vendrá como: .../reset-password#access_token=xyz&refresh_token=...&type=recovery
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');
                const type = hashParams.get('type');
                const error = hashParams.get('error_description');

                if (error) throw new Error(error.replace(/\+/g, ' '));

                if (accessToken && type === 'recovery') {
                    // 4. ESTABLECER SESIÓN EN EL NAVEGADOR
                    // Como tenemos el token directo, no necesitamos intercambiar nada.
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (error) throw error;

                    // Mostrar formulario
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('reset-form').classList.remove('hidden');
                } else {
                    throw new Error("Enlace inválido. Asegúrate de abrir el enlace desde el correo.");
                }

            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-text').textContent = err.message;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        async function updatePassword() {
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            
            if (pwd.length < 6) {
                alert("Mínimo 6 caracteres"); return;
            }

            btn.disabled = true;
            btn.textContent = "Guardando...";

            try {
                // Al tener sesión activa (gracias al paso 4), podemos actualizar el user
                const { error } = await supabaseClient.auth.updateUser({ password: pwd });
                if (error) throw error;

                document.getElementById('reset-form').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');

            } catch (err) {
                document.getElementById('form-error').textContent = err.message;
                btn.disabled = false;
                btn.textContent = "Reintentar";
            }
        }

        init();
    </script>
</body>
</html>
